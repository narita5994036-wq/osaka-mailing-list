name: MykitaWarranty
options:
  bundleIdPrefix: com.mykita
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
targets:
  MykitaWarranty:
    type: application
    platform: iOS
    sources:
      - path: MykitaWarranty
        excludes:
          - "AppIcon-source-512.png"
          # Resources/ is added explicitly below as a single folder
          # reference (so index.html's relative asset paths resolve).
          # Without this exclude, XcodeGen's recursive scan of this
          # top-level `MykitaWarranty` path ALSO picks up every file
          # under Resources/ individually, copying each one twice into
          # the bundle (once flattened to the bundle root as its own
          # Copy Bundle Resources entry, once nested under Resources/ via
          # the folder reference) — a duplication that was intermittently
          # tripping up `codesign` on a physical-device build with
          # "code object is not signed at all" against a different
          # resource file each run.
          - "Resources/**"
      - path: MykitaWarranty/Resources
        type: folder
        buildPhase: resources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: MYKITA JAPAN
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mykita.warranty
        # Left as the target name (no spaces) on purpose — this becomes the
        # .app bundle's filename, which build scripts below reference by
        # path. CFBundleDisplayName above ("MYKITA JAPAN") is what actually
        # shows under the icon on the Home Screen; they're independent.
        # Osaka MYKITA's Personal Team (found via Xcode > Signing &
        # Capabilities, or `security find-certificate -a -c "Apple
        # Development" -p ~/Library/Keychains/login.keychain-db | openssl
        # x509 -noout -subject` once a dev certificate exists — see the OU=
        # field). Override on the command line with DEVELOPMENT_TEAM=... or
        # `make device TEAM_ID=...` for a different team.
        DEVELOPMENT_TEAM: "9FYL3F3ZD8"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1" # iPhone only
        SWIFT_VERSION: "5.0"
